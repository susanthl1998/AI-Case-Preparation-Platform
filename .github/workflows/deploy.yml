name: Deploy

# Runs only after CI succeeds on main, never straight off a push. That
# ordering is the point: migrations must be applied before the new code
# that depends on them starts serving traffic, and neither should happen
# if the tests failed.
#
# Render's auto-deploy is disabled (see render.yaml) so this workflow owns
# the sequence: migrate, then release.
#
# Required repository secrets (Settings → Secrets and variables → Actions):
#   DATABASE_URL         Postgres URL, postgresql+psycopg2:// scheme
#   RENDER_DEPLOY_HOOK   Render → service → Settings → Deploy Hook
#
# Vercel deploys the frontend through its own GitHub integration and needs
# nothing here — a static build has no migration to coordinate with.
on:
  workflow_run:
    workflows: ["CI"]
    types: [completed]
    branches: [main]

# Never run two deploys at once: concurrent `alembic upgrade head` runs
# against one database is how you get a half-applied schema.
concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  deploy:
    name: Migrate and release
    runs-on: ubuntu-latest
    if: github.event.workflow_run.conclusion == 'success'

    steps:
      - uses: actions/checkout@v4
        with:
          # workflow_run checks out the default branch by default; pin it
          # to the exact commit CI validated, so we never deploy code that
          # was not the code tested.
          ref: ${{ github.event.workflow_run.head_sha }}

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: backend/requirements.txt

      - name: Install dependencies
        working-directory: backend
        run: pip install -r requirements.txt

      - name: Apply database migrations
        working-directory: backend
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: |
          if [ -z "$DATABASE_URL" ]; then
            echo "::error::DATABASE_URL secret is not set — cannot migrate."
            exit 1
          fi
          alembic upgrade head

      - name: Trigger Render deploy
        env:
          HOOK: ${{ secrets.RENDER_DEPLOY_HOOK }}
        run: |
          if [ -z "$HOOK" ]; then
            echo "::error::RENDER_DEPLOY_HOOK secret is not set — migrations applied but nothing was released."
            exit 1
          fi
          # --fail so an error response fails the job rather than looking
          # like a successful deploy.
          curl --fail --silent --show-error -X POST "$HOOK" > /dev/null
          echo "Render deploy triggered for ${{ github.event.workflow_run.head_sha }}"
