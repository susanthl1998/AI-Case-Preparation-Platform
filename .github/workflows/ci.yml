name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Shared repo, three teams: this runs on every PR so one module's change
# can't silently break another's. If you add a module with its own test
# directory, extend the backend job rather than adding a parallel one, so
# there is a single place to look when CI is red.
jobs:
  backend:
    name: Backend tests (FastAPI + Postgres)
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: casearena
          POSTGRES_PASSWORD: casearena
          POSTGRES_DB: casearena_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U casearena"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    defaults:
      run:
        working-directory: backend

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: backend/requirements.txt

      - name: Install dependencies
        run: pip install -r requirements.txt

      # Catches import errors and bad migrations before the suite runs,
      # and verifies the schema applies to real Postgres rather than the
      # SQLite the tests use.
      - name: Run Alembic migrations against Postgres
        env:
          DATABASE_URL: postgresql+psycopg2://casearena:casearena@localhost:5432/casearena_test
        run: alembic upgrade head

      - name: Run test suite (SQLite, fast + isolated per test)
        run: pytest -v

  frontend:
    name: Frontend build
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: frontend

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      # No package-lock.json is committed yet — generate one with a local
      # `npm install` and commit it, then this can become `npm ci` with
      # dependency caching.
      - name: Install dependencies
        run: npm install

      - name: Build
        run: npm run build
