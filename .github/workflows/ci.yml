name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Shared repo, three teams. Every job here runs on every pull request so
# one module's change cannot silently break another's — which is the whole
# reason this pipeline exists.
#
# If you add a module with its own tests, extend the existing jobs rather
# than adding parallel ones, so there is a single place to look when CI is
# red.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend tests
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: casearena
          POSTGRES_PASSWORD: casearena
          POSTGRES_DB: casearena_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U casearena"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    defaults:
      run:
        working-directory: backend

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: backend/requirements.txt

      - name: Install dependencies
        run: pip install -r requirements.txt

      # All three teams share one Alembic history. Two migrations branched
      # from the same parent produce multiple heads, and then `alembic
      # upgrade head` fails in EVERY environment — not just the branch that
      # caused it. Catching it on the PR keeps that blast radius at zero.
      - name: Check for a single migration head
        run: |
          heads=$(alembic heads 2>/dev/null | grep -c "(head)" || true)
          echo "migration heads: $heads"
          if [ "$heads" -ne 1 ]; then
            echo "::error::Expected exactly 1 migration head, found $heads."
            echo "Rebase on main and set your migration's down_revision to the current head."
            alembic heads
            exit 1
          fi

      # Applying migrations to real Postgres catches what SQLite silently
      # tolerates: native enum types, stricter typing, JSON semantics.
      - name: Apply migrations to Postgres
        env:
          DATABASE_URL: postgresql+psycopg2://casearena:casearena@localhost:5432/casearena_test
        run: alembic upgrade head

      - name: Run tests
        run: pytest -v

  frontend:
    name: Frontend tests and build
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: frontend

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      # No package-lock.json is committed yet — generate one with a local
      # `npm install` and commit it, then this can become `npm ci` with
      # dependency caching.
      - name: Install dependencies
        run: npm install

      - name: Run tests
        run: npm test

      # A passing test suite still doesn't prove the app compiles for
      # production — Vitest transforms modules differently from a real
      # build, so this catches import and syntax errors tests would miss.
      - name: Build
        run: npm run build
